name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and current Python
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install flake8
        run: python -m pip install flake8
      - name: Compile
        run: python -m py_compile setup-lastfm.py
      - name: flake8
        run: python -m flake8 setup-lastfm.py
      - name: Help runs without arguments
        # No arguments prints help and exits 2
        run: |
          set +e
          python setup-lastfm.py 2> help.txt
          test $? -eq 2
          grep -q -- "--setup" help.txt
